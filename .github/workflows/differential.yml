#
# 差分测试：核心 DER 解码 vs OpenSSL asn1parse（主参照），asn1tools（可选）。
# 参照工具缺失时显式 skipped，绝不静默通过。
# 样本清单在 tests/differential/diff_asnber.py 的 REAL_DERS 中维护，包含
# PKCS#8/PKCS#1/PKCS#10；参照工具只做对照，不链接、不进入产物。

name: differential

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  differential:
    name: der-differential
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: 检查参照工具
        id: tools
        shell: bash
        run: |
          if command -v openssl >/dev/null 2>&1; then
            echo "openssl=yes" >> "$GITHUB_OUTPUT"
          else
            echo "openssl=no" >> "$GITHUB_OUTPUT"
          fi
          if python3 -c "import asn1tools" >/dev/null 2>&1; then
            echo "asn1tools=yes" >> "$GITHUB_OUTPUT"
          else
            echo "asn1tools=no" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装 asn1tools（可选参照）
        if: steps.tools.outputs.asn1tools == 'no'
        run: pip install asn1tools || true

      - name: 构建 asnber_dump
        if: steps.tools.outputs.openssl == 'yes'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DASNBER_BUILD_STATIC=ON -DASNBER_BUILD_SHARED=OFF \
            -DASNBER_BUILD_TESTS=OFF -DASNBER_BUILD_TOOLS=OFF \
            -DASNBER_BUILD_DIFFERENTIAL=ON
          cmake --build build --parallel

      - name: 差分（OpenSSL + 可选 asn1tools）
        if: steps.tools.outputs.openssl == 'yes'
        run: |
          set +e
          # CI 没有本地构建目录，asnber_dump 路径显式指向上一步的构建产物。
          python3 tests/differential/diff_asnber.py \
            --asnber-dump build/tests/differential/asnber_dump \
            --data-dir tests/data \
            --report tests/differential/differential-report.md \
            --report-json tests/differential/differential-report.json
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "SKIPPED: 参照工具缺失，差分未执行"
            exit 0
          fi
          exit "$rc"

      - name: 校验报告与 JSON 为最新
        if: steps.tools.outputs.openssl == 'yes'
        run: |
          # 记录只含 DER 结构与结论，不含工具版本/时间戳；
          # 重新生成后与检入版本必须逐字节一致，Markdown 与 JSON 任一份
          # 过期（或只更新了其中一份）都在这里直接失败。
          git diff --exit-code -- \
            tests/differential/differential-report.md \
            tests/differential/differential-report.json

      - name: 校验报告样本清单与脚本清单一致
        if: steps.tools.outputs.openssl == 'yes'
        run: |
          # git diff 只能发现“文件与本次重生成结果不同”；样本被漏跑时
          # 两份记录会一起变短，仍然“自洽”。这里再做一次清单比对：
          # JSON 里的样本名必须与 diff_asnber.py 的 REAL_DERS 完全一致。
          python3 - <<'PY'
          import json
          import sys

          sys.path.insert(0, "tests/differential")
          import diff_asnber

          with open("tests/differential/differential-report.json",
                    encoding="utf-8") as handle:
              report = json.load(handle)
          listed = [item["sample"] for item in report["samples"]]
          expected = list(diff_asnber.REAL_DERS)
          if listed != expected:
              print("样本清单不一致")
              print("  报告中缺少:", sorted(set(expected) - set(listed)))
              print("  报告中多出:", sorted(set(listed) - set(expected)))
              print("  顺序是否一致:", listed == expected)
              sys.exit(1)
          if report["summary"]["samples"] != len(expected):
              print("summary.samples=%d 与清单 %d 不一致"
                    % (report["summary"]["samples"], len(expected)))
              sys.exit(1)
          print("样本清单一致：%d 份" % len(expected))
          PY

      - name: 上传差分记录
        if: always() && steps.tools.outputs.openssl == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: differential-report
          path: |
            tests/differential/differential-report.md
            tests/differential/differential-report.json

      - name: 标记跳过（openssl 缺失）
        if: steps.tools.outputs.openssl == 'no'
        run: |
          echo "SKIPPED: openssl 未安装，差分未执行"