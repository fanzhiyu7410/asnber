# libFuzzer 短预算矩阵。长跑不在此工作流。
# schema_load 语料包含核心与 PKIX/PKCS 描述表；decode/roundtrip 语料包含
# PKCS#8/PKCS#1/PKCS#10 真实样本。本地等价命令见 tests/fuzz/README.md 与
# docs/07-测试与验证.md。

name: fuzz

on:
  workflow_dispatch:

jobs:
  libfuzzer:
    name: fuzz-${{ matrix.harness }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        harness:
          - decode_ber
          - decode_der
          - reader
          - schema_decode
          - roundtrip
          - schema_load
          - asnberc
          - pkix_open
          - pkcs_open
          - cms_open
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang

      - name: 配置
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -fno-omit-frame-pointer" \
            -DCMAKE_CXX_FLAGS="-fsanitize=fuzzer-no-link,address,undefined -fno-omit-frame-pointer" \
            -DASNBER_BUILD_STATIC=ON \
            -DASNBER_BUILD_SHARED=OFF \
            -DASNBER_BUILD_TESTS=OFF \
            -DASNBER_BUILD_TOOLS=ON \
            -DASNBER_BUILD_FUZZ=ON

      - name: 构建
        run: cmake --build build --parallel

      - name: 短预算 fuzz（60s）
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: |
          ./build/tests/fuzz/fuzz_${{ matrix.harness }} \
            tests/fuzz/corpus/${{ matrix.harness }} \
            -max_total_time=60 -max_len=4096 -rss_limit_mb=2048 \
            -print_final_stats=1
