#
# 覆盖率门禁（Linux Clang + llvm-cov）。
#
# 只构建静态库：共享库与静态库会产出两份对象，同时统计会重复计数。
# 全量 ctest 产生的 profraw 合并后，由 scripts/check_coverage.py
# 对 src/CMakeFiles/asnber_static.dir 下的核心对象聚合，行覆盖 ≥ 80%、
# 分支覆盖 ≥ 70%（目标见 docs/07-测试与验证.md 第 7 节）。

name: coverage

on:
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  llvm-cov:
    name: linux-clang-llvm-cov
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具链
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang llvm

      - name: 配置
        run: |
          cmake -S . -B build-cov -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_FLAGS="-fprofile-instr-generate -fcoverage-mapping" \
            -DCMAKE_CXX_FLAGS="-fprofile-instr-generate -fcoverage-mapping" \
            -DCMAKE_EXE_LINKER_FLAGS="-fprofile-instr-generate" \
            -DASNBER_BUILD_TESTS=ON \
            -DASNBER_BUILD_SHARED=OFF \
            -DASNBER_BUILD_STATIC=ON \
            -DASNBER_WARNINGS_AS_ERRORS=ON

      - name: 构建
        run: cmake --build build-cov --parallel

      - name: 测试并采集覆盖率
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/build-cov/covdata/%p-%m.profraw
        run: |
          mkdir -p build-cov/covdata
          ctest --test-dir build-cov --output-on-failure

      - name: 覆盖率门禁
        run: python3 scripts/check_coverage.py --build-dir build-cov

      - name: 汇总（写入 job summary）
        if: always()
        run: |
          if [ -f build-cov/coverage-report.txt ]; then
            tail -n 40 build-cov/coverage-report.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 上传报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build-cov/coverage-report.txt
          if-no-files-found: warn
